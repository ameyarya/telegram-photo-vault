function updateNav() {
  const list = curList();
  $("#vPrev").hidden = viewerIdx <= 0;
  $("#vNext").hidden = viewerIdx >= list.length - 1;
}

const zoom = {s: 1, x: 0, y: 0};
function applyZoom() {
  const img = $("#vMain img.v-media"); if (!img) return;
  img.style.transform = zoom.s === 1 ? "" : `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`;
  img.classList.toggle("zoomed", zoom.s > 1);
  $("#vZoom").classList.toggle("on", zoom.s > 1);
}
function setZoom(s, cx, cy) {
  const img = $("#vMain img.v-media"); if (!img) return;
  s = Math.min(8, Math.max(1, s));
  if (s === 1) { zoom.s = 1; zoom.x = zoom.y = 0; img.style.width = img.style.height = ""; return applyZoom(); }
  if (zoom.s === 1) {  // keep its fitted size, so swapping in the full-size original below doesn't change the scale
    const fit = img.getBoundingClientRect(); img.style.width = fit.width + "px"; img.style.height = fit.height + "px";
  }
  const r = $("#vMain").getBoundingClientRect();
  cx = (cx ?? r.left + r.width / 2) - (r.left + r.width / 2); cy = (cy ?? r.top + r.height / 2) - (r.top + r.height / 2);
  // keep the point under the cursor still
  zoom.x = cx - (cx - zoom.x) * s / zoom.s; zoom.y = cy - (cy - zoom.y) * s / zoom.s; zoom.s = s;
  applyZoom();
  const it = curList()[viewerIdx];   // zoomed in: swap in the full-resolution original when the browser can show it
  if (it && s > 1.5 && !img.dataset.full && /^(jpe?g|png|webp|gif)$/.test(it.ext) && it.size < 60e6) {
    img.dataset.full = 1; const big = new Image(); big.onload = () => { if (curList()[viewerIdx] === it) img.src = big.src; }; big.src = `/original/${it.id}`;
  }
}

function showItem() {
  const list = curList(), it = list[viewerIdx]; if (!it) return;
  if (!viewList && viewerIdx >= list.length - 8) loadMore();
  updateNav();
  zoom.s = 1; zoom.x = zoom.y = 0; $("#vZoom").classList.remove("on");
  const box = $("#vMain");
  box.querySelectorAll(".v-media,.v-ph,.spinner,.v-msg").forEach(e => e.remove());
  $("#vDl").href = `/original/${it.id}?download=1`;
  $("#shareMenu").hidden = true;
  clearTimeout(sharePrefetch);       // a photo you stay on is fetched quietly, so Share opens straight away
  if (it.kind !== "video") sharePrefetch = setTimeout(() => shareFile(it).catch(() => {}), 1200);
  setFavIcon(it.fav);
  $("#vZoom").hidden = it.kind === "video";
  $("#vLive").hidden = !it.live_id; $("#vLive").classList.remove("on");
  renderInfo(it);
  if (it.kind === "video") {
    const v = document.createElement("video");
    Object.assign(v, {controls: true, autoplay: true, playsInline: true, preload: "metadata", className: "v-media"});
    if (it.thumb !== -1) v.poster = `/thumb/${it.id}`;
    v.src = `/original/${it.id}`;
    v.onerror = () => fail(v, "This video can't be played in the browser. Use the download button to get the original.");
    box.prepend(v);
    return;
  }
  if (it.thumb !== -1) { const ph = new Image(); ph.className = "v-ph"; ph.onerror = () => ph.remove(); ph.src = `/thumb/${it.id}`; box.prepend(ph); }
  const sp = document.createElement("div"); sp.className = "spinner"; box.append(sp);
  const img = new Image(); img.className = "v-media v-zoom"; img.alt = it.name; img.draggable = false;
  img.onload = () => { sp.remove(); box.querySelector(".v-ph")?.remove(); };
  img.onerror = async () => {
    if (img.dataset.full) return;
    const r = await fetch(`/view/${it.id}`).catch(() => null);
    fail(img, (r && (await r.json().catch(() => ({}))).detail) || "Couldn't load this photo.");
  };
  img.src = `/view/${it.id}`;
  box.prepend(img);
  const nx = list[viewerIdx + 1]; if (nx?.kind === "image") new Image().src = `/view/${nx.id}`;
}
function fail(el, text) {
  el.remove(); $("#vMain").querySelector(".spinner")?.remove();
  const m = document.createElement("div"); m.className = "v-msg"; m.textContent = text; $("#vMain").append(m);
}
function playLive() {
  const it = curList()[viewerIdx], box = $("#vMain"), img = box.querySelector("img.v-media");
  if (!it?.live_id || box.querySelector(".v-live")) return;
  setZoom(1);
  const v = document.createElement("video");
  Object.assign(v, {autoplay: true, playsInline: true, className: "v-media v-live"});
  v.poster = `/view/${it.id}`;
  const back = () => { v.remove(); if (img) img.style.display = ""; $("#vLive").classList.remove("on"); };
  v.onended = back;
  v.onerror = () => { back(); toast("This Live Photo's motion clip can't be played in this browser. It's in the download as a separate .MOV."); };
  v.onclick = back;
  v.src = `/original/${it.live_id}`;
  if (img) img.style.display = "none";
  box.querySelector(".v-ph")?.remove();
  box.prepend(v); $("#vLive").classList.add("on");
}
$("#vLive").onclick = () => $("#vMain .v-live") ? $("#vMain .v-live").onended() : playLive();
// slideshow: the next photo every few seconds (videos are skipped), until the last one or the viewer closes
const SLIDE_MS = 4000;
let slideTimer = null;
function slideshow(on = !slideTimer) {
  clearInterval(slideTimer); slideTimer = null;
  $("#vPlay").classList.toggle("on", on);
  $("#vPlay").title = on ? "Stop the slideshow (s)" : "Slideshow (s)";
  if (!on) return;
  slideTimer = setInterval(() => {
    if (zoom.s > 1) return;
    const list = curList(); let n = viewerIdx + 1;
    while (list[n]?.kind === "video") n++;
    if (list[n]) { viewerIdx = n; showItem(); }
    else if (viewList || (!feed.loading && feed.base + list.length >= feed.total)) slideshow(false);
  }, SLIDE_MS);
}
$("#vPlay").onclick = () => slideshow();
function step(d) { const n = viewerIdx + d; if (n >= 0 && n < curList().length) { viewerIdx = n; showItem(); } }

let press = null;
$("#vMain").addEventListener("pointerdown", e => { press = {x: e.clientX, y: e.clientY, mouse: e.pointerType === "mouse"}; });
$("#vMain").addEventListener("click", e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) return;   // that was a drag to look around
  if (!e.target.closest(".v-media, .v-ph, .spinner, .v-msg, .v-top, .v-nav")) {     // the black space around it
    zoom.s > 1 ? setZoom(1) : closeViewer();
    return;
  }
  if (!e.target.closest("img.v-media") || !press?.mouse) return;
  zoom.s > 1 ? setZoom(1) : setZoom(2.5, e.clientX, e.clientY);
});
$("#vMain").addEventListener("wheel", e => {
  if (!$("#vMain img.v-media") || (!e.ctrlKey && zoom.s === 1)) return;
  e.preventDefault();
  if (e.ctrlKey) setZoom(zoom.s * Math.exp(-e.deltaY / 200), e.clientX, e.clientY);
  else { zoom.x -= e.deltaX; zoom.y -= e.deltaY; applyZoom(); }
}, {passive: false});
let drag = null;
$("#vMain").addEventListener("mousedown", e => { if (zoom.s > 1 && e.target.closest(".v-media")) { drag = {x: e.clientX - zoom.x, y: e.clientY - zoom.y}; e.preventDefault(); } });
addEventListener("mousemove", e => { if (drag) { zoom.x = e.clientX - drag.x; zoom.y = e.clientY - drag.y; applyZoom(); } });
addEventListener("mouseup", () => drag = null);
$("#vZoom").onclick = () => zoom.s > 1 ? setZoom(1) : setZoom(2.5);

function setFavIcon(on) { $("#vFav").innerHTML = ico(on ? "star" : "star-o"); $("#vFav").classList.toggle("on", !!on); $("#vFav").title = on ? "Remove from favorites (f)" : "Add to favorites (f)"; }
async function toggleFav() {
  const it = curList()[viewerIdx]; if (!it) return;
  const on = !it.fav;
  await post(on ? "/api/favorites" : "/api/favorites/remove", {ids: [it.id]});
  it.fav = on ? 1 : 0; setFavIcon(on);
  if (inFavorites()) viewerIdx < 0 ? route() : reorderPending = true;  // the grid behind redraws when the viewer closes
  const f = feed?.items.find(x => x.id === it.id); if (f) f.fav = it.fav;
}
$("#vFav").onclick = toggleFav;
async function trashCurrent() {           // the next photo slides in; Undo in the toast puts it back
  const list = curList(), it = list[viewerIdx];
  if (!it || document.body.classList.contains("member")) return;
  try { await trashItems([it.id]); } catch (e) { return toast(esc(e.message)); }
  list.splice(viewerIdx, 1);
  reorderPending = true;                   // the grid behind redraws when the viewer closes
  if (!list.length) return closeViewer();
  viewerIdx = Math.min(viewerIdx, list.length - 1);
  showItem();
}
$("#vTrash").onclick = trashCurrent;
$("#vAlbum").onclick = () => { const it = curList()[viewerIdx]; if (it) addToAlbum([it.id]).then(() => renderInfo(it)); };

async function renderInfo(it) {
  const base = `<header><button class="icon-btn" id="vInfoClose" aria-label="Close info">${ico("close")}</button>Info</header>
    <div class="info-h">Details</div>
    <div class="info-row">${ico("cal")}<div><b>${longDate(it.taken_at)}</b><span>${timeLabel(it.taken_at)}${it.date_src === "file" ? " · from file date (no camera date)" : it.date_src === "user" ? " · date edited" : ""}</span></div>
      <button class="txt-btn edit-date owner-only" id="vEditDate" title="Edit date &amp; time">Edit</button></div>
    <div class="info-row">${ico(it.kind === "video" ? "play" : "photo")}<div><b>${esc(it.name)}</b>
      <span>${[mp(it.width, it.height), size(it.size), it.kind === "video" ? dur(it.duration) : ""].filter(Boolean).join(" · ")}</span></div></div>
    <div id="infoMore"></div>
    <div class="info-row">${ico("folder")}<div><b><a data-href="#/album/${encodeURIComponent(it.album)}">${esc(albumTitle(it.album))}</a></b><span>${esc(it.album)}</span></div></div>
    <div class="info-row">${ico(it.cloud ? "cloud" : "cloud-off")}<div><b>${it.cloud ? "Backed up to Telegram" : "Not backed up yet"}</b>
      <span>${it.cloud ? "Viewable even with the drive unplugged" : "Only on the drive for now"}</span></div></div>`;
  $("#vInfo").innerHTML = base;
  $("#vInfoClose").onclick = () => toggleInfo(false);
  $("#vEditDate").onclick = async () => {
    const d = await api(`/api/item/${it.id}`);
    if (!await dateDialog([it.id], [it], d)) return;
    const fresh = await api(`/api/item/${it.id}`);
    it.taken_at = fresh.taken_at; it.date_src = fresh.date_src;
    const f = feed?.items.find(x => x.id === it.id); if (f) { f.taken_at = it.taken_at; f.date_src = it.date_src; }
    renderInfo(it); toast("Date changed. It moves to its new place in the timeline when you close the photo.");
    reorderPending = true;
  };
  $("#vInfo").onclick = e => { const a = e.target.closest("a[data-href]"); if (a) { const h = a.dataset.href; closeViewer(); setTimeout(() => location.hash = h, 0); } };
  try {
    const d = await api(`/api/item/${it.id}`);
    if (curList()[viewerIdx]?.id !== it.id) return;
    const exp = d.exposure ? (d.exposure >= 1 ? `${d.exposure}s` : `1/${Math.round(1 / d.exposure)}`) : "";
    const settings = [exp, d.fnumber ? `f/${d.fnumber}` : "", d.focal ? `${Math.round(d.focal)}mm` : "", d.iso ? `ISO ${d.iso}` : ""].filter(Boolean).join(" · ");
    let more = "";
    if (d.make || d.model) more += `<div class="info-row">${ico("camera")}<div><b>${esc([d.make, d.model].filter(Boolean).join(" "))}</b><span>${esc([d.lens, settings].filter(Boolean).join(" · "))}</span></div></div>`;
    if (d.lat != null) more += `<div class="info-row">${ico("place")}<div><b>${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</b><span><a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=15/${d.lat}/${d.lon}" target="_blank" rel="noopener noreferrer">Open map</a></span></div></div>`;
    if (d.people.length) more += `<div class="info-row">${ico("people")}<div><b>People</b><span class="info-chips">${d.people.map(p => `<a data-href="#/person/${p.id}">${esc(p.name || "Unnamed")}</a>`).join("")}</span></div></div>`;
    if (d.user_albums.length) more += `<div class="info-row">${ico("albums")}<div><b>In your albums</b><span class="info-chips">${d.user_albums.map(a => `<a data-href="#/ualbum/${a.id}">${esc(a.name)}</a>`).join("")}</span></div></div>`;
    $("#infoMore").innerHTML = more;
  } catch {}
}
function toggleInfo(on = !infoOpen) { infoOpen = on; $("#viewer").classList.toggle("info", on); }

$("#vBack").onclick = () => closeViewer();
$("#vInfoBtn").onclick = () => toggleInfo();
$("#vPrev").onclick = () => step(-1);
$("#vNext").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (viewerIdx < 0) {
    if (e.key === "Escape" && picked.size) clearPicked();
    if (e.key.toLowerCase() === "a" && (e.ctrlKey || e.metaKey) && $("#selectAll")) { e.preventDefault(); pickAll(); }
    return;
  }
  if (e.key === "Escape") zoom.s > 1 ? setZoom(1) : infoOpen && innerWidth < 900 ? toggleInfo(false) : closeViewer();
  else if (e.key === "ArrowLeft" && zoom.s === 1) step(-1);
  else if (e.key === "ArrowRight" && zoom.s === 1) step(1);
  else if (e.key === "i") toggleInfo();
  else if (e.key === "f") toggleFav();
  else if (e.key === "s") slideshow();
  else if (e.key === "Delete" || e.key === "Backspace") trashCurrent();
  else if (e.key === "l") $("#vLive").hidden || $("#vLive").click();
  else if (e.key === "+" || e.key === "=") setZoom(zoom.s * 1.5);
  else if (e.key === "-") setZoom(zoom.s / 1.5);
  else if (e.key === "0") setZoom(1);
});
let tx = null, ty = null;
let pinch = null, pan = null, lastTap = 0;
const mid = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
const spread = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
$("#vMain").addEventListener("touchstart", e => {
  const img = $("#vMain img.v-media");
  if (e.touches.length === 2 && img) { pinch = {d: spread(e.touches), s: zoom.s}; pan = null; tx = null; return; }
  if (e.touches.length === 1 && zoom.s > 1 && img) { pan = {x: e.touches[0].clientX - zoom.x, y: e.touches[0].clientY - zoom.y}; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
$("#vMain").addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [cx, cy] = mid(e.touches);
    setZoom(pinch.s * spread(e.touches) / pinch.d, cx, cy);
  } else if (pan && e.touches.length === 1 && zoom.s > 1) {
    e.preventDefault();
    zoom.x = e.touches[0].clientX - pan.x; zoom.y = e.touches[0].clientY - pan.y; applyZoom();
  }
}, {passive: false});
$("#vMain").addEventListener("touchend", e => {
  if (e.touches.length < 2) pinch = null;
  if (!e.touches.length) pan = null;
  const t = e.changedTouches[0];
  if (tx !== null && !e.touches.length && Math.abs(t.clientX - tx) < 10 && Math.abs(t.clientY - ty) < 10 && e.target.closest(".v-media")) {
    if (Date.now() - lastTap < 300) {   // double-tap: zoom in there, or back out
      lastTap = 0; e.preventDefault();
      zoom.s > 1 ? setZoom(1) : setZoom(2.5, t.clientX, t.clientY);
      tx = null; return;
    }
    lastTap = Date.now();
  }
  if (tx === null || zoom.s > 1) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy > 90) closeViewer();
  tx = null;
});

// ---------- side nav / search ----------
// rounded down, so it only says 100% when every item is backed up
const backedPct = (n, total) => !total ? 100 : n >= total ? 100 : Math.min(99, Math.floor(n * 100 / total));
function closeSide() { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); }
// Narrow screens: the menu slides in over the page. Wide screens: the sidebar hides and shows (remembered).
$("#menuBtn").onclick = () => {
  if (innerWidth > 900) {
    const closed = document.body.classList.toggle("side-closed");
    try { localStorage.setItem("pv-side", closed ? "closed" : "open"); } catch {}
    return;
  }
  $("#side").classList.toggle("open"); $("#scrim").classList.toggle("open");
};
try { if (localStorage.getItem("pv-side") === "closed") document.body.classList.add("side-closed"); } catch {}
$("#scrim").onclick = closeSide;
// Folders in the sidebar fold away (remembered)
try { if (localStorage.getItem("pv-folders") === "closed") $("#side").classList.add("folders-closed"); } catch {}
$("#foldersToggle").onclick = () => {
  const closed = $("#side").classList.toggle("folders-closed");
  $("#foldersToggle").setAttribute("aria-expanded", String(!closed));
  try { localStorage.setItem("pv-folders", closed ? "closed" : "open"); } catch {}
};
$("#searchForm").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) location.hash = "#/search/" + encodeURIComponent(q); };
$("#q").addEventListener("input", () => { $("#qClear").hidden = !$("#q").value; });
$("#qClear").onclick = () => { $("#q").value = ""; $("#qClear").hidden = true; $("#q").focus(); };

function renderSide() {
  const tops = {};
  for (const a of albums) { const t = a.album.split("/")[0]; tops[t] = (tops[t] || 0) + a.n; }
  $("#topFolders").innerHTML = Object.keys(tops).sort().map(t =>
    `<a class="sub-link" href="#/album/${encodeURIComponent(t)}" data-route="folder" data-folder="${esc(t)}">${ico("folder")}${esc(folderName(t))}</a>`).join("");
  if (!status) return;
  const pct = status.total ? Math.round(100 * status.uploaded / status.total) : 0;
  $("#stat").innerHTML = `
    <div title="${nf(status.uploaded)} of ${nf(status.total)} photos & videos in Telegram">${ico("cloud")} Backed up ${backedPct(status.uploaded, status.total)}%</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div><span class="status-dot ${status.telegram ? "on" : ""}"></span>Telegram ${status.telegram ? "connected" : "offline"}</div>
    <div><span class="status-dot ${status.drive ? "on" : ""}"></span>Drive ${status.drive ? "plugged in" : "unplugged"}</div>
    <div>${nf(status.total)} photos & videos indexed</div>`;
  drawAccount();
}
async function loadUserAlbums() { userAlbums = await api("/api/user-albums"); }

// Signing in never leaves the page: a reload here left the old sign-in page as a step in the history on Android,
// so Back (or closing a photo) went to the sign-in page again
function showLogin() {
  document.body.classList.add("signed-out");
  document.body.insertAdjacentHTML("beforeend", `<div class="login"><form id="loginForm" method="post" autocomplete="on">
      <h1><svg viewBox="0 0 24 24"><use href="#i-photo"/></svg>Photos</h1>
      <input id="lName" name="username" autocomplete="username" placeholder="Name" autocapitalize="none" required>
      <input id="lPw" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <div class="err" id="lErr"></div><button class="fill-btn">Sign in</button></form></div>`);
  $("#lName").focus();
  $("#loginForm").onsubmit = async e => {
    e.preventDefault(); $("#lErr").textContent = "";
    try { await post("/api/login", {name: $("#lName").value, password: $("#lPw").value}); }
    catch (err) { $("#lErr").textContent = err.message; $("#lPw").select(); return; }
    signedIn();
  };
}
function signedIn() {
  document.querySelector(".login")?.remove(); document.body.classList.remove("signed-out");
  boot().catch(e => { $("#page").innerHTML = `<div class="empty">Couldn't start: ${esc(e.message)}</div>`; });
}
// Back to this page while Chrome kept it showing the sign-in form, signed in since in another tab: the gallery
addEventListener("pageshow", async e => {
  if (e.persisted && $("#loginForm") && (await fetch("/api/me")).ok) signedIn();
});

// Refresh: new photos, folders and the backup status, without reloading the page (filter and order stay)
async function refreshAll() {
  const b = $("#refreshBtn"); b?.classList.add("spinning");
  try {
    [status, albums, folderNames] = await Promise.all([api("/api/status"), api("/api/albums"), api("/api/folder-names"), loadUserAlbums()]);
    renderSide();
    await route();
  } catch (e) { toast(esc(e.message)); }
  finally { $("#refreshBtn")?.classList.remove("spinning"); }
}

// ---------- account menu (top right) ----------
function drawAccount() {
  if (!me) return;
  const name = me.local ? "This Mac" : me.name, initial = me.local ? ico("laptop") : esc((me.name || "?").trim()[0].toUpperCase());
  const role = me.role === "owner" ? "Full access" : "View, favorite, albums";
  $("#acctBtn").innerHTML = initial; $("#acctBtn").title = `${name} · ${role}`;
  $("#acctMenu").innerHTML = `<div class="acct-head"><span class="avatar">${initial}</span><span><b>${esc(name)}</b><span>${role}</span></span></div>
    ${me.local ? `<a href="#/sharing" data-acct>${ico("share")}Sharing & accounts</a>` : ""}
    ${me.local ? `<a href="/setup" target="_blank" data-acct>${ico("phone")}Set up a phone</a>` : ""}
    <a href="#/backup" data-acct>${ico("cloud-done")}Backup & upload</a>
    ${me.role === "owner" ? `<a href="#/trash" data-acct>${ico("trash")}Trash</a>` : ""}
    ${me.local ? "" : `<button class="item" id="signOut">${ico("logout")}Sign out</button>`}`;
  $("#signOut") && ($("#signOut").onclick = async () => { await post("/api/logout"); location.reload(); });
}
$("#acctBtn").onclick = e => { e.stopPropagation(); $("#acctMenu").hidden = !$("#acctMenu").hidden; };
$("#acctMenu").onclick = e => { e.stopPropagation(); if (e.target.closest("[data-acct]")) $("#acctMenu").hidden = true; };
document.addEventListener("click", () => { if ($("#acctMenu")) $("#acctMenu").hidden = true; });

async function boot() {
  const r = await fetch("/api/me");
  if (r.status === 401) return showLogin();
  me = await r.json();
  document.body.classList.toggle("member", me.role !== "owner");
  document.body.classList.toggle("mac", !!me.local);
  [status, albums, folderNames] = await Promise.all([api("/api/status"), api("/api/albums"), api("/api/folder-names"), loadUserAlbums()]);
  renderSide();
  route();
  setInterval(async () => { try { status = await api("/api/status"); renderSide(); } catch {} }, 60000);
}
boot().catch(e => { $("#page").innerHTML = `<div class="empty">Couldn't start: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
