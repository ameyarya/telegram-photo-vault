<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='3' width='20' height='18' rx='4' fill='%230b57d0'/><path d='M6 17l3.5-4.5 2.5 3 3.5-4.5 4.5 6z' fill='white'/></svg>">
<style>
:root{
  --bg:#ffffff; --surface:#f8fafd; --ink:#1f1f1f; --ink2:#444746; --line:#e1e3e1;
  --pill:#d3e3fd; --pill-ink:#041e49; --search:#e9eef6; --accent:#0b57d0; --tile:#eceff1; --hover:rgb(31 31 31/.06);
  --font:"Google Sans Text","Google Sans",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131314; --surface:#1b1b1d; --ink:#e3e3e3; --ink2:#c4c7c5; --line:#2f3133;
  --pill:#004a77; --pill-ink:#c2e7ff; --search:#282a2c; --accent:#a8c7fa; --tile:#232427; --hover:rgb(227 227 227/.08);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--hover)}

/* ---------- shell ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg);z-index:20}
.topbar.scrolled{box-shadow:0 1px 3px rgb(0 0 0/.12)}
/* wide screens: the logo fills up to the page content, so the search box lines up with it (8 + 40 + 8 + 208 = 264, + the page's 8) */
.top-left{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px}   /* left and right weigh the same: search sits centred */
.logo{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--ink2);min-width:0;white-space:nowrap}
.logo svg{width:30px;height:30px;color:var(--accent)}
.search{flex:0 1 720px;min-width:0;height:48px;border-radius:24px;background:var(--search);display:flex;align-items:center;gap:8px;padding:0 6px 0 20px}   /* centred */
.top-right{flex:1 1 0;display:flex;justify-content:flex-end;min-width:0}
.acct-wrap{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;font-size:15px;
  display:grid;place-items:center;padding:0}
.avatar svg{width:22px;height:22px;fill:currentColor;color:var(--bg)}
.acct-menu{position:absolute;right:0;top:46px;z-index:40;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:260px;
  box-shadow:0 6px 24px rgb(0 0 0/.35);display:grid;gap:2px}
.acct-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acct-head .avatar{width:44px;height:44px;font-size:18px;cursor:default}
.acct-head b{display:block;font-weight:500}.acct-head span{color:var(--ink2);font-size:13px}
.acct-menu a,.acct-menu button.item{display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:10px;color:var(--ink);text-decoration:none;
  background:none;border:0;font:inherit;cursor:pointer;width:100%;text-align:left}
.acct-menu a:hover,.acct-menu button.item:hover{background:var(--hover)}
.acct-menu a svg,.acct-menu button.item svg{width:20px;height:20px;color:var(--ink2)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink2)}
.spacer{flex:1}
.status-dot{width:10px;height:10px;border-radius:50%;background:#9aa0a6}
.status-dot.on{background:#1e8e3e}
.side{position:fixed;top:64px;bottom:0;left:0;width:256px;padding:8px 12px 16px 0;overflow:auto;background:var(--bg);z-index:15;display:flex;flex-direction:column}
.side > *{flex-shrink:0}   /* a short window scrolls the sidebar instead of squeezing its rows */
.side a{display:flex;align-items:center;gap:18px;height:52px;padding:0 24px;border-radius:0 24px 24px 0;color:var(--ink);text-decoration:none;font-weight:500}
.side a svg{color:var(--ink2)}
.side a:hover{background:var(--hover)}
.side a.active{background:var(--pill);color:var(--pill-ink)}
.side a.active svg{color:var(--pill-ink)}
.side .side-brand{display:none;height:64px;align-items:center;padding-left:20px;margin-bottom:8px}
.side h4{margin:18px 24px 6px;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:.02em}
.fold-btn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
.fold-btn svg{width:18px;height:18px;transition:transform .15s}
.side.folders-closed .fold-btn svg{transform:rotate(-90deg)}
.side.folders-closed #topFolders{display:none}
.side .sub-link{height:40px;font-weight:400;font-size:14px}
.side .stat{margin:auto 24px 0;padding-top:16px;color:var(--ink2);font-size:12px;display:grid;gap:8px}
.side .stat div{display:flex;align-items:center;gap:8px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
main{position:fixed;top:64px;bottom:0;left:256px;right:0;overflow-y:auto;overflow-x:hidden}
@media (min-width:901px){body.side-closed .side{display:none}body.side-closed main{left:0}}
.page{padding:8px 32px 80px 16px}
.page-head{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.page-head h1{margin:0;font-size:28px;font-weight:400;line-height:1.25}
.page-sub{color:var(--ink2);margin:0 0 8px 48px;font-size:14px}
.page-head.no-back + .page-sub{margin-left:0}
.sort-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border:1px solid var(--line);
  border-radius:18px;color:var(--ink2);font-weight:500;white-space:nowrap}
.sort-btn:hover{background:var(--hover)}
.sort-btn svg{width:20px;height:20px}
.crumbs{margin:0 0 2px 48px;font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{color:var(--ink2);text-decoration:none;border-radius:4px}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.sec{font-size:16px;font-weight:500;margin:24px 0 12px}
.all-link{display:inline-flex;align-items:center;gap:6px;margin:16px 0 0;color:var(--accent);text-decoration:none;font-weight:500}
.all-link:hover{text-decoration:underline}
.empty{padding:80px 16px;text-align:center;color:var(--ink2)}

/* ---------- timeline ---------- */
.day{padding-top:20px}
.day h3{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px}
.day-sel{width:22px;height:22px;margin-left:-4px;color:var(--ink2);cursor:pointer;opacity:0;transition:opacity .15s;display:grid;place-items:center;flex:none}
.day-sel svg{width:22px;height:22px}
.day:hover .day-sel,.selecting .day-sel,.day-sel.on{opacity:1}
.day-sel.on{color:var(--accent)}
@media (hover:none){.day-sel{opacity:.55}}
.row{display:flex;gap:4px;margin-bottom:4px}
.tile{position:relative;background:var(--tile);overflow:hidden;cursor:pointer;flex:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.tile img.ok{opacity:1}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgb(0 0 0/.25),transparent 30%);opacity:0;transition:opacity .15s}
.tile:hover::after{opacity:1}
.tile .dur{position:absolute;top:6px;right:6px;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;gap:3px;
  z-index:1;background:rgb(0 0 0/.5);padding:2px 4px 2px 8px;border-radius:12px}
.tile .dur svg{width:16px;height:16px}
.tile .off{position:absolute;bottom:6px;right:6px;color:#fff;z-index:1;background:rgb(0 0 0/.5);border-radius:50%;
  width:24px;height:24px;display:grid;place-items:center}
.tile .off svg{width:15px;height:15px}
.tile .fname{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:11px;color:var(--ink2);text-align:center;word-break:break-all}
.sentinel{height:1px}

/* ---------- albums ---------- */
.group h2{font-size:16px;font-weight:500;margin:28px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:24px 16px}
.card{cursor:pointer;min-width:0}
.card .cover{aspect-ratio:1;border-radius:12px;background:var(--tile);overflow:hidden}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.card:hover .cover img{transform:scale(1.03)}
.card b{display:block;margin-top:10px;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;color:#e3e3e3}
.viewer.open{display:flex}
.v-main{position:relative;flex:1;min-width:0;display:grid;place-items:center;overflow:hidden}
/* absolutely centred inside the viewer so large photos can never push the controls off screen */
.v-media,.v-ph{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.v-ph{filter:blur(20px);opacity:.6}
.v-top{position:absolute;inset:0 0 auto 0;height:64px;display:flex;align-items:center;gap:4px;padding:0 8px;
  background:linear-gradient(to bottom,rgb(0 0 0/.55),transparent);z-index:3;transition:opacity .2s}
.v-top .icon-btn,.v-nav{color:#fff}
.v-top .icon-btn:hover{background:rgb(255 255 255/.12)}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgb(32 33 36/.6);z-index:3;opacity:0;transition:opacity .2s}
.v-main:hover .v-nav{opacity:1}
.v-nav:hover{background:rgb(60 64 67/.85)}
.v-nav[hidden]{display:none}
.v-prev{left:16px}.v-next{right:16px}
.v-msg{max-width:420px;padding:24px;text-align:center;color:#c4c7c5}
.spinner{position:absolute;width:40px;height:40px;border:3px solid rgb(255 255 255/.18);border-top-color:#a8c7fa;border-radius:50%;animation:spin .9s linear infinite;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.v-info{width:360px;flex:none;background:#1f1f1f;border-left:1px solid #333;overflow:auto;display:none}
.viewer.info .v-info{display:block}
.v-info header{display:flex;align-items:center;gap:12px;height:64px;padding:0 8px 0 16px;font-size:20px}
.v-info header .icon-btn{color:#e3e3e3}
.v-info header .icon-btn:hover{background:rgb(255 255 255/.1)}
.info-row{display:flex;gap:20px;padding:14px 24px;align-items:flex-start}
.info-row svg{color:#c4c7c5;margin-top:2px}
.info-row b{display:block;font-weight:400;font-size:15px;color:#e3e3e3;word-break:break-word}
.info-row span{display:block;color:#c4c7c5;font-size:13px;word-break:break-word}
.info-row a{color:#a8c7fa;cursor:pointer;text-decoration:none}
.info-h{padding:18px 24px 4px;font-size:12px;color:#c4c7c5;letter-spacing:.04em;text-transform:uppercase}

.scrim{display:none}

/* ---------- chips, selection, dialogs, toast ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.filter-wrap{position:relative;display:inline-block}
.filter-btn{height:36px;padding:0 10px 0 12px;border-radius:18px;border:1px solid var(--line);color:var(--ink);background:none;font:inherit;font-weight:500;
  font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.filter-btn svg{width:18px;height:18px}
.filter-btn.on{background:var(--pill);color:var(--pill-ink);border-color:transparent}
.head-actions .chips{margin:0}
.filter-menu{position:absolute;right:0;top:42px;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;
  display:grid;min-width:200px;box-shadow:0 6px 24px rgb(0 0 0/.35)}
.filter-menu .chip{border:0;border-radius:8px;height:38px;width:100%;justify-content:flex-start;padding:0 12px 0 34px;position:relative;background:none;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.filter-menu .chip svg{position:absolute;left:10px;width:18px;height:18px}
.filter-menu .chip:hover{background:var(--hover)}
.filter-menu .chip.on{background:var(--pill);color:var(--pill-ink)}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--pill);color:var(--pill-ink);border-color:transparent}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.sort-btn{margin-left:0}
.tile .sel{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;z-index:2;color:#fff;opacity:0;transition:opacity .15s;display:grid;place-items:center}
.tile .sel svg{width:24px;height:24px;filter:drop-shadow(0 0 2px rgb(0 0 0/.6))}
.tile:hover .sel,.selecting .tile .sel{opacity:.85}
.tile.picked .sel{opacity:1;color:var(--accent)}
.tile.picked .sel svg{filter:none;background:#fff;border-radius:50%}
.tile.picked img{transform:scale(.88);border-radius:6px}
.tile.picked{background:var(--pill)}
.tile .fav{position:absolute;bottom:6px;left:6px;color:#fff;z-index:1;filter:drop-shadow(0 0 2px rgb(0 0 0/.7))}
.tile .fav svg{width:18px;height:18px}
.selbar{position:fixed;top:0;left:0;right:0;height:64px;background:var(--pill);color:var(--pill-ink);z-index:40;display:flex;align-items:center;gap:8px;padding:0 16px 0 8px}
.selbar b{font-size:18px;font-weight:500;margin-right:auto}
.selbar .icon-btn{color:var(--pill-ink)}
.txt-btn{height:36px;padding:0 14px;border-radius:18px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.txt-btn:hover{background:var(--hover)}
.txt-btn svg{width:20px;height:20px}
.fill-btn{height:36px;padding:0 18px;border-radius:18px;font-weight:500;background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.fill-btn{color:#062e6f}}
.dialog-bg{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:150;display:grid;place-items:center}
.dialog{background:var(--bg);color:var(--ink);border-radius:20px;padding:24px;width:min(440px,92vw);max-height:80vh;overflow:auto;box-shadow:0 8px 32px rgb(0 0 0/.3)}
.dialog h2{margin:0 0 12px;font-size:20px;font-weight:500}
.dialog p{color:var(--ink2);margin:0 0 12px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dialog input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.pick-list{display:grid;gap:4px;margin:8px 0}
.pick-list button{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;text-align:left}
.pick-list button:hover{background:var(--hover)}
.pick-list img,.pick-list .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--tile)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:8px;z-index:200;box-shadow:0 4px 16px rgb(0 0 0/.3);display:flex;gap:16px;align-items:center;max-width:92vw}
.toast a{color:#a8c7fa;cursor:pointer;font-weight:500}

/* ---------- date scrubber ---------- */
.scrubber{position:fixed;top:64px;bottom:0;right:0;width:64px;z-index:10;cursor:pointer;user-select:none}
.scrubber::before{content:"";position:absolute;top:10px;bottom:10px;right:6px;width:2px;border-radius:1px;background:var(--line)}
.scrubber .yr{position:absolute;right:16px;font-size:11px;color:var(--ink2);transform:translateY(-50%);pointer-events:none}
.scrubber .pos{position:absolute;right:3px;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent);pointer-events:none}
.scrubber .tip{position:absolute;right:30px;transform:translateY(-50%);background:var(--accent);color:#fff;font-size:12px;font-weight:500;padding:3px 8px;border-radius:12px;white-space:nowrap;pointer-events:none;display:none}
@media (prefers-color-scheme: dark){.scrubber .tip{color:#062e6f}}
.scrubber:hover .tip,.scrubber.active .tip{display:block}
.scrubber{touch-action:none}
.scrubber .pos{transition:top .08s}
.scrubber.dragging .pos{width:12px;height:12px;margin-top:-6px;right:1px;transition:none}
@media (max-width:600px){                     /* phones: a thin bar on the edge that appears while scrolling */
  .scrubber{width:36px;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrubber.active{opacity:1;pointer-events:auto}
  .scrubber .yr{display:none}
  .scrubber::before{right:8px;width:4px;border-radius:2px}
  .scrubber .pos{right:4px;width:12px;height:12px;margin-top:-6px}
  body.with-scrubber .page{padding-right:8px}
}
.with-scrubber .page{padding-right:72px}

/* ---------- people / similar / dashboard ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 12px}
.person{cursor:pointer;text-align:center;min-width:0}
.person img,.person .ph{width:120px;height:120px;border-radius:50%;object-fit:cover;background:var(--tile);display:block;margin:0 auto 8px}
.person b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{color:var(--ink2);font-size:12px}
.person b[data-name]{color:var(--accent)}
.subject .face{object-fit:cover}
.subjects-help{margin-top:10px}
.subjects-help svg{width:1.2em;height:1.2em;vertical-align:-.25em}
#peopleMore{margin-top:16px}
.person .unnamed{color:var(--accent);font-weight:400}
.sim-group{margin:18px 0 26px}
.sim-group h3{font-size:14px;font-weight:500;margin:0 0 8px;color:var(--ink2)}
.sim-row{display:flex;gap:4px;flex-wrap:wrap}
.sim-row .tile{width:150px;height:150px}
.tile .live{position:absolute;top:6px;right:6px;color:#fff;z-index:1;font-size:10px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:3px;
  filter:drop-shadow(0 0 2px rgb(0 0 0/.7))}
.tile .live svg,.v-top #vLive svg{width:16px;height:16px}
.v-top #vLive{width:auto;padding:0 12px;border-radius:18px;font-size:12px;font-weight:700;letter-spacing:.06em;gap:6px;display:inline-flex;align-items:center}
.v-top #vLive.on{background:rgb(255 255 255/.18);color:#fdd663}
.sim-group .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.sim-group .head h3{margin:0 auto 0 0}
.sim-group .tile .sel{display:none}
.sim-group .tile .tg{position:absolute;left:6px;top:6px;z-index:2;height:24px;padding:0 8px;border-radius:12px;font-size:11px;font-weight:600;
  display:flex;align-items:center;gap:4px;background:rgb(0 0 0/.55);color:#fff}
.sim-group .tile .tg svg{width:14px;height:14px}
.sim-group .tile.keep .tg{background:#1e8e3e}
.sim-group .tile.drop img{opacity:.4;filter:grayscale(.6)}
.sim-group .tile.drop .tg{background:rgb(0 0 0/.6);width:24px;padding:0;justify-content:center}
.sim-group .tile.keep{outline:3px solid #1e8e3e;outline-offset:-3px}
.sim-summary{color:var(--ink2);margin:4px 0 8px}
.sim-more{width:150px;height:150px;border-radius:4px;background:var(--tile);color:var(--ink);font-weight:500;cursor:pointer}
.sim-group .tile .best{position:absolute;bottom:6px;left:6px;z-index:1;font-size:11px;font-weight:600;color:#fff;background:rgb(0 0 0/.55);border-radius:10px;padding:1px 8px}
.review{display:grid;gap:10px;margin-top:12px;max-width:760px}
.pair{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);flex-wrap:wrap}
.pair .who,.pair .who *{text-decoration:none;color:inherit}
.pair .who{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.pair .who img,.pair .who .ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--tile);flex:none}
.pair .who img.more{width:40px;height:40px;margin-left:-14px;border:2px solid var(--surface)}
.pair .who > span{margin-left:4px}
.review{max-width:980px}
.pair .who b{display:block;font-weight:500}
.pair .who span{color:var(--ink2);font-size:12px}
.pair .q{color:var(--ink2);font-size:13px;margin:0 4px}
.pair .acts{margin-left:auto;display:flex;gap:4px}
.maybe{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.maybe .m{display:flex;align-items:center;gap:6px}

.people.selecting .person{opacity:.75}
.person.picked{opacity:1!important}
.person.picked img,.person.picked .ph{outline:4px solid var(--accent);outline-offset:3px}
.trash-tile .sel{display:none}
.trash-tile .tg{position:absolute;left:6px;top:6px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgb(0 0 0/.55);color:#fff;display:grid;place-items:center}
.trash-tile .tg svg{width:18px;height:18px}
.trash-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.trash-grid .tile{width:150px;height:150px}
body.member .owner-only,body:not(.mac) .mac-only{display:none!important}
body.signed-out>:not(.login,svg){display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.login form{width:100%;max-width:340px;display:grid;gap:12px}
.login h1{font-weight:400;font-size:26px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.login h1 svg{width:32px;height:32px;fill:var(--accent)}
.login input,.share input,.share select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.login .err{color:#d93025;min-height:1.4em;font-size:14px}
.login button{height:44px}
.me{margin:6px 24px 0;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.me a{color:var(--accent);cursor:pointer}
.share{max-width:760px}
.share .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{width:40px;height:22px;accent-color:var(--accent)}
.acct{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.acct:first-child{border-top:0}
.acct .dev{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.share form input{flex:1;min-width:150px}
.info-row .edit-date{margin-left:auto;align-self:flex-start;color:#a8c7fa}
.date-dlg label{display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer}
.date-dlg input[type=datetime-local]{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;width:100%;box-sizing:border-box;margin:6px 0 10px;color-scheme:light dark}
.date-dlg .sugg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.page-sub a,.note a{color:var(--accent)}
.note svg,.page-sub svg{width:1.25em;height:1.25em;vertical-align:-.3em}  /* icons inside a line of text */
.note .all-link{margin:0 0 0 4px}
.fixes{display:grid;gap:8px;margin-top:12px;max-width:900px}
.fix{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.fix img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--tile)}
.fix .what{flex:1;min-width:200px;font-size:13px;color:var(--ink2)}
.fix .what b{color:var(--ink);font-weight:500;font-size:14px}
.fix .arrow{color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}
#refreshBtn.spinning svg{animation:spin .8s linear infinite}
/* the page's buttons (filter, view, refresh, order) are round icons on the right; their names are tooltips and for screen readers */
.head-actions .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.head-actions .txt-btn:has(.lbl),.head-actions .sort-btn,.head-actions .filter-btn{width:40px;height:40px;padding:0;gap:0;justify-content:center;
  border-radius:50%;border:0;background:none;color:var(--ink2);flex:none}
.head-actions .txt-btn:has(.lbl):hover,.head-actions .sort-btn:hover,.head-actions .filter-btn:hover{background:var(--hover)}
.head-actions .filter-btn.on{background:var(--pill);color:var(--pill-ink)}
.head-actions .sort-btn.oldest svg{transform:scaleY(-1)}
.head-actions{gap:2px}  /* phones: Restore and Refresh as icons, so all fit */
@media (max-width:600px){.page-head{flex-wrap:wrap}.head-actions{flex-wrap:wrap;justify-content:flex-end}}  /* a long title: the buttons take the next row */
.tile img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}  /* hold a photo to select it */
.mem-head{display:flex;align-items:center;justify-content:space-between}.mem-head .sec{margin:12px 0}
.mem-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.mem-card{position:relative;flex:none;width:150px;height:190px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface);color:#fff;font:inherit;text-align:left}
.mem-card img{width:100%;height:100%;object-fit:cover;display:block}
.mem-card span{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgb(0 0 0/.65));font-size:14px;font-weight:500}
.mem-card small{display:block;font-weight:400;opacity:.85}
#vPlay.on{color:var(--accent)}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink2);padding:24px 0}
.spin.inline{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.view-wrap{position:relative}
.share-wrap{position:relative;display:inline-flex}
#vShare{position:relative}
#vShare.busy svg{opacity:.25}
#vShare.busy::after{content:"";position:absolute;left:50%;top:50%;margin:-9px 0 0 -9px;width:18px;height:18px;border:2px solid rgb(255 255 255/.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.share-menu{position:absolute;right:0;top:46px;z-index:30;background:#2a2b2e;border-radius:10px;padding:6px;display:grid;min-width:160px;box-shadow:0 6px 24px rgb(0 0 0/.5)}
.share-menu button,.share-menu a{background:none;border:0;color:#fff;font:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;text-decoration:none}
.share-menu button:hover,.share-menu a:hover{background:rgb(255 255 255/.1)}
.view-menu{position:absolute;right:0;top:44px;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;
  box-shadow:0 6px 24px rgb(0 0 0/.35);display:grid;gap:10px;min-width:300px}
.vm-row{display:flex;align-items:center;gap:6px}

.vm-row>span{width:64px;color:var(--ink2);font-size:13px}
.seg{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);color:var(--ink);background:none;cursor:pointer;font:inherit;font-size:13px}
.seg.on{background:var(--pill);color:var(--pill-ink);border-color:transparent}
#days.continuous .day{padding-top:0}
#days.continuous .day + .day{margin-top:0}
.restore-panel{max-width:860px;margin:12px 0}
.restore-panel h3{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.restore-panel .muted svg{width:1.25em;height:1.25em;vertical-align:-.3em}
.restore-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.restore-row select{flex:1;min-width:200px;max-width:480px;height:40px;border-radius:8px;border:1px solid var(--line);color:var(--ink);padding:0 40px 0 12px;font:inherit;

.restore-row .fill-btn{display:inline-flex;align-items:center;height:40px;text-decoration:none}
.up-box{max-width:640px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:12px}
.up-box .chips{flex-wrap:wrap}
.up-pick{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border:2px dashed var(--line);border-radius:16px;text-align:center}
.up-pick .fill-btn{height:48px;padding:0 24px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.up-pick .fill-btn.disabled{opacity:.5;pointer-events:none}
.up-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.up-stats b{display:block;font-size:22px;font-weight:400}
.up-stats span{font-size:12px;color:var(--ink2)}
.up-now{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.up-err{font-size:13px;color:#d93025}
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
.up-tile{position:relative;aspect-ratio:1;background:var(--tile);overflow:hidden;border-radius:4px}
.up-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.up-tile .fname{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:10px;color:var(--ink2);text-align:center;word-break:break-all}
.up-tile .dur{position:absolute;top:4px;right:4px;color:#fff}
.up-tile .dur svg{width:16px;height:16px}
.up-badge{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;color:#fff;background:rgb(0 0 0/.6)}
.up-tile.backed_up .up-badge{background:#1e8e3e}

.up-tile.uploading .up-badge{background:var(--accent)}
.up-tile.failed .up-badge{background:#d93025}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:500}
.big{font-size:32px;font-weight:400;line-height:1.1}
.muted{color:var(--ink2);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--ink2)}
.hbar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.hbar .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.35}
.hbar .track b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.hbar .n{text-align:right;color:var(--ink2)}
.logbox{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
.ok-dot,.bad-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#1e8e3e}
.bad-dot{background:#d93025}
.job{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0}
.job .bar{height:6px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink2);margin:8px 0}
.note.warn{display:flex;gap:12px;align-items:flex-start;border-color:#e8a33d;background:color-mix(in srgb,#e8a33d 12%,var(--surface));color:var(--ink);margin:0 0 16px}
.note.warn > svg{flex:none;width:22px;height:22px;fill:#e8a33d}
.v-zoom{cursor:zoom-in}
.zoomed{cursor:zoom-out}
.zoomed:active{cursor:grabbing}
#vMain img.v-media{touch-action:none}  /* pinch and drag go to the photo, not the page */
.v-top .icon-btn.on{color:#fdd663}
.info-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.info-chips a{background:rgb(255 255 255/.08);border-radius:12px;padding:2px 10px;font-size:12px}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s;width:280px;top:0;padding-top:0;z-index:31;
    border-radius:0 16px 16px 0}
  .side.open{transform:none;box-shadow:0 0 24px rgb(0 0 0/.25)}
  .side .side-brand{display:flex}
  .scrim.open{display:block;position:fixed;inset:0;background:rgb(0 0 0/.32);z-index:30}
  main{left:0}
  .logo span{display:none}.logo{flex:none;padding-right:4px}.top-left{flex:none}
  .search{flex:1 1 0}.top-right{flex:none}
  .page{padding:4px 8px 80px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 8px}
  .v-info{position:absolute;inset:auto 0 0 0;width:auto;max-height:60%;border:0;border-top:1px solid #333;z-index:4}
  .v-nav{display:none}
  .scrubber{width:40px}
  .people{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .person img,.person .ph{width:88px;height:88px}
  .sim-row .tile,.trash-grid .tile{width:31vw;height:31vw}
}

<script>
const $ = s => document.querySelector(s);
const ico = (id, cls = "") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAGE = 400, GAP = 4;
let albums = [], userAlbums = [], status = null, me = null;
let feed = null;          // current timeline (see openFeed)
let viewerIdx = -1, infoOpen = false;
let newestFirst = true;   // timeline order: newest first on every visit; the sort button flips it until a reload
const DEFAULT_CHIP = "photos";  // pages with chips open on Photos, not All
let filterChip = null;    // active filter chip on the current page (null: not picked yet, the page's default)
const picked = new Set(); // selected item ids

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401 && me && !me.local) { location.reload(); throw new Error("Signed out"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const post = (url, body) => api(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body ?? {})});

// ---------- formatting ----------
const nf = n => (n ?? 0).toLocaleString();
const size = b => b >= 1e12 ? (b/1e12).toFixed(2)+" TB" : b >= 1e9 ? (b/1e9).toFixed(1)+" GB" : b >= 1e6 ? (b/1e6).toFixed(1)+" MB" : !b ? "0 KB" : Math.max(1, Math.round(b/1e3))+" KB";
const dur = s => { s = Math.round(s || 0); const h = s/3600|0, m = (s%3600)/60|0, x = String(s%60).padStart(2,"0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; };
const asDate = iso => new Date(iso.slice(0,19));
const dayLabel = iso => {
  const d = asDate(iso), now = new Date();
  const opts = {weekday:"short", month:"short", day:"numeric"};
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
};
const longDate = iso => asDate(iso).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
const monthLabel = ym => new Date(ym + "-15T12:00:00").toLocaleDateString(undefined, {month:"short", year:"numeric"});
const timeLabel = iso => asDate(iso).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
const BRANDS = {iphone: "iPhone", icloud: "iCloud", ipad: "iPad"};
const pretty = seg => seg.replace(/[_]+/g, " ").replace(/\s+/g, " ").trim()
  .replace(/\b\p{Ll}/gu, c => c.toUpperCase()).replace(/\b(iphone|icloud|ipad)\b/gi, w => BRANDS[w.toLowerCase()]);
const plural = (n, word) => `${nf(n)} ${word}${n === 1 ? "" : "s"}`;
let folderNames = {};   // your names for folders (gallery only; the drive keeps the real names)
const folderName = path => folderNames[path] || pretty(path.split("/").pop());
const albumTitle = folderName;
const mp = (w, h) => w && h ? `${Math.round(w*h/1e6)}MP · ${w} × ${h}` : "";
const ago = t => { const s = Date.now()/1000 - t; return s < 90 ? "just now" : s < 5400 ? `${Math.round(s/60)} min ago` : `${Math.round(s/3600)} h ago`; };
function toast(html, ms = 5000) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html; document.body.append(t);
  setTimeout(() => t.remove(), ms); return t;
}

// ---------- routing ----------
const NAV = {"/photos": "photos", "/albums": "albums", "/favorites": "favorites", "/people": "people", "/people/review": "people", "/similar": "similar", "/backup": "backup", "/trash": "trash", "/sharing": "sharing", "/dates": "backup", "/upload": "backup"};
let lastPath = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "/photos";
  closeSide();
  clearPicked();
  if (h !== lastPath) filterChip = null;   // chips belong to a page
  lastPath = h;
  const inPath = h.replace(/^\/(album|all)\//, "");
  const folder = /^\/(album|all)\//.test(h) &&
    [...document.querySelectorAll(".side a[data-folder]")].find(a => inPath === a.dataset.folder || inPath.startsWith(a.dataset.folder + "/"));
  const section = folder ? null
    : NAV[h] ?? (/^\/(album|all|ualbum)\//.test(h) ? "albums" : h.startsWith("/person/") ? "people" : h.startsWith("/search/") ? null : "photos");
  document.querySelectorAll(".side a").forEach(a =>
    a.classList.toggle("active", a === folder || (!a.dataset.folder && a.dataset.route === section)));
  $("#main").scrollTop = 0;
  hideScrubber();
  if (!h.startsWith("/search/") && document.activeElement !== $("#q")) { $("#q").value = ""; $("#qClear").hidden = true; }
  if (h === "/albums") return renderAlbums();
  if (h === "/people") return renderPeople();
  if (h === "/people/review") return renderPeopleReview();
  if (h === "/trash") return renderTrash();
  if (h === "/sharing") return renderSharing();
  if (h === "/dates") return renderDates();
  if (h === "/upload") return renderUpload();
  if (h === "/similar") return renderSimilar();
  if (h === "/backup") return renderBackup();
  if (h === "/favorites") return openFeed({title: "Favorites", params: {filter: "favorites"}, chips: false, restoreLabel: "Favorites", noBack: true});
  if (h.startsWith("/album/")) return openFolder(h.slice(7));
  if (h.startsWith("/all/")) return openFolder(h.slice(5), true);
  if (h.startsWith("/ualbum/")) return openUserAlbum(+h.slice(8));
  if (h.startsWith("/person/")) return openPerson(+h.slice(8));
  if (h.startsWith("/search/")) return openSearch(h.slice(8));
  openFeed({title: "Photos", params: {}, noBack: true, noSub: true, pre: `<div id="memories"></div>`});
  loadMemories();
}
window.addEventListener("hashchange", () => { if (viewerIdx < 0) route(); });

// ---------- albums page: your albums + folders ----------
function renderAlbums() {
  feed = null;
  let html = `<div class="page-head no-back"><h1>Albums</h1>
      <div class="head-actions"><button class="txt-btn" id="newAlbum">${ico("add")}New album</button></div></div>`;
  html += userAlbums.length
    ? `<div class="cards">` + userAlbums.map(a => cardHtml("#/ualbum/" + a.id, a.name, plural(a.n, "item"), a.cover, "ua")).join("") + `</div>`
    : `<div class="note">Make your own albums: select photos (tick the circle on any photo) and choose “Add to album”, or press “New album”. They live only on this Mac.</div>`;
  // folders on the drive are in the sidebar (Folders); this page is just the albums you make
  $("#page").innerHTML = html;
  bindCards();
  $("#newAlbum").onclick = async () => {
    const name = await promptDialog("New album", "Album name");
    if (!name) return;
    const a = await post("/api/user-albums", {name});
    await loadUserAlbums();
    location.hash = "#/ualbum/" + a.id;
  };
}

function cardHtml(href, title, sub, cover, kind = "") {
  return `<div class="card ${kind}" data-href="${esc(href)}">
    <div class="cover">${cover ? `<img loading="lazy" src="/thumb/${cover}" alt="" onerror="this.remove()">` : ""}</div>
    <b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
}
function bindCards(root = $("#page")) {
  root.querySelectorAll(".card").forEach(c => c.onclick = () => location.hash = c.dataset.href);
}

function childFolders(path) {
  const kids = new Map(), pre = path + "/";
  for (const a of albums) {
    if (!a.album.startsWith(pre)) continue;
    const name = a.album.slice(pre.length).split("/")[0], child = pre + name;
    const k = kids.get(child) ?? {path: child, name, n: 0, folders: new Set(), cover: null};
    k.n += a.n;
    if (a.album !== child) k.folders.add(a.album.slice(child.length + 1).split("/")[0]);
    if (!k.cover || a.album === child) k.cover = a.cover ?? k.cover;
    kids.set(child, k);
  }
  return [...kids.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
}
const folderTotal = path => albums.reduce((s, a) => s + (a.album === path || a.album.startsWith(path + "/") ? a.n : 0), 0);

// ---------- pages built on the timeline ----------
function openFolder(album, all = false) {
  const kids = all ? [] : childFolders(album);
  const direct = albums.find(a => a.album === album)?.n || 0;
  const parts = album.split("/");
  const crumbs = parts.map((seg, i) => i === parts.length - 1 && !all ? ""
    : `<a href="#/album/${encodeURIComponent(parts.slice(0, i + 1).join("/"))}">${esc(folderName(parts.slice(0, i + 1).join("/")))}</a>`).filter(Boolean).join(" <span>›</span> ");
  let pre = "";
  if (kids.length) {
    pre += `<div class="cards">` + kids.map(k => cardHtml("#/album/" + encodeURIComponent(k.path), folderName(k.path),
      plural(k.n, "item") + (k.folders.size ? ` · ${plural(k.folders.size, "folder")}` : ""), k.cover)).join("") + `</div>`;

// ---------- the timeline engine ----------
// A window into an ordered list (base = position of items[0]) that can grow at both ends,
// so the date scrubber can jump to any month of a 70,000-photo library.
function openFeed(o) {
  const params = {...o.params};
  // A page with chips and no filter of its own starts on DEFAULT_CHIP; one without chips shows everything.
  if (filterChip === null) filterChip = o.chips === false || params.filter ? "" : DEFAULT_CHIP;
  feed = {o, params, base: 0, items: [], total: null, loading: false, loadingPrev: false, months: null};
  // the filters fold into one button ("Photos ▾") that opens the list, instead of rows of pills
  const filters = [["", "All"], ["photos", "Photos"], ["videos", "Videos"], ["favorites", "Favorites"], ["live", "Live photos"],
    ["raw", "RAW"], ["screenshots", "Screenshots"], ["located", "With location"], ["notbackedup", "Not backed up"], ["undated", "No camera date"]]
    .filter(([k]) => !(params.filter || "").split(",").includes(k) || !k);
  const current = (filters.find(([k]) => k === filterChip) || filters[0])[1];
  const chips = o.chips === false ? "" : `<div class="chips filter-wrap" id="chips">
    <button class="filter-btn ${filterChip !== DEFAULT_CHIP ? "on" : ""}" id="filterBtn" aria-haspopup="true" aria-expanded="false" title="Showing: ${current}">${ico("filter")}<span class="lbl">${current}</span></button>
    <div class="filter-menu" id="filterMenu" hidden>${filters.map(([k, label]) =>
      `<button class="chip ${filterChip === k ? "on" : ""}" data-f="${k}">${filterChip === k ? ico("check") : ""}${label}</button>`).join("")}</div></div>`;
  const back = o.noBack ? "" : `<button class="icon-btn" id="pgBack" aria-label="Back">${ico("back")}</button>`;
  $("#page").innerHTML = `<div class="page-head ${o.noBack ? "no-back" : ""}">${back}<h1>${esc(o.title)}</h1>
      <div class="head-actions">${o.empty ? "" : chips}${o.actions || ""}${o.empty ? "" : `<button class="txt-btn" id="selectAll" aria-label="Select all" title="Select all (Ctrl/⌘ A)">${ico("check")}<span class="lbl">Select all</span></button>`}<span class="view-wrap"><button class="txt-btn" id="viewBtn" aria-label="View options" title="Layout, size and shape">${ico("view")}<span class="lbl">View</span></button>${viewMenu()}</span><button class="txt-btn" id="refreshBtn" aria-label="Refresh" title="Load new photos and the latest backup status">${ico("refresh")}<span class="lbl">Refresh</span></button>${o.empty ? "" : sortBtn()}</div></div>
    ${o.crumbs ? `<div class="crumbs" id="crumbs">${o.crumbs}</div>` : ""}<div class="page-sub" id="pgSub" ${o.noSub ? "hidden" : ""}></div>${o.pre || ""}
    <div class="sentinel" id="topSentinel"></div><div id="days">${loadingHtml()}</div>`;
  if (o.back) $("#pgBack").onclick = () => location.hash = o.back;
  bindCards();
  $("#refreshBtn").onclick = () => refreshAll();
  $("#selectAll") && ($("#selectAll").onclick = pickAll);
  bindViewMenu();
  $("#sortBtn") && ($("#sortBtn").onclick = () => {
    newestFirst = !newestFirst;
    route();
  });
  $("#chips")?.addEventListener("click", e => {
    e.stopPropagation();
    if (e.target.closest("#filterBtn")) {
      const m = $("#filterMenu"); m.hidden = !m.hidden; $("#filterBtn").setAttribute("aria-expanded", String(!m.hidden)); return;
    }
    const c = e.target.closest(".chip"); if (!c) return; filterChip = c.dataset.f; route();
  });
  if (filterChip === "undated") $("#chips")?.insertAdjacentHTML("afterend", `<div class="note owner-only">These have no camera date, so they're dated by the file.
    Select some and press ${ico("cal-edit")} to set or shift their date, or see <a href="#/dates">suggested dates</a>.</div>`);
  if (o.empty) { feed.total = 0; $("#pgSub").textContent = o.empty; return; }
  topObserver.observe($("#topSentinel"));
  loadMore().then(loadMonths);
}
const sortBtn = () => `<button class="sort-btn ${newestFirst ? "" : "oldest"}" id="sortBtn" title="${newestFirst ? "Newest first" : "Oldest first"} (click to change)">${ico("sort")}<span class="lbl">${newestFirst ? "Newest first" : "Oldest first"}</span></button>`;

function feedQuery(f = feed) {
  const p = {...f.params};
  if (filterChip) p.filter = [p.filter, filterChip].filter(Boolean).join(",");
  return p;
}
function feedUrl(path, extra) {
  const p = {...feedQuery(), order: newestFirst ? "desc" : "asc", ...extra};
  return path + "?" + new URLSearchParams(Object.entries(p).filter(([, v]) => v !== undefined && v !== "")).toString();
}

async function fetchPage(offset, limit) {
  return api(feedUrl("/api/items", {offset, limit}));
}

async function loadMore() {
  const f = feed;
  if (!f || f.loading || (f.total !== null && f.base + f.items.length >= f.total)) return;
  f.loading = true;
  try {
    const r = await fetchPage(f.base + f.items.length, PAGE);
    if (f !== feed) return;
    f.total = r.total;
    f.items.push(...r.items);
    renderSections();
    const range = !r.first ? "" : r.first.slice(0, 10) === r.last.slice(0, 10) ? longDate(r.first) : `${longDate(r.first)} – ${longDate(r.last)}`;
    $("#pgSub").textContent = f.total ? plural(f.total, "item") + (f.o.extraSub || "") + (range ? " · " + range : "")
      : f.o.extraSub ? "" : "";
    if (!f.total) $("#days").innerHTML = `<div class="empty">${esc(f.o.emptyText || (filterChip ? "Nothing matches this filter." : "Nothing here yet — it will appear once indexed."))}</div>`;
    if (viewerIdx >= 0) updateNav();
  } catch (e) {
    $("#days")?.insertAdjacentHTML("beforeend", `<div class="empty">Couldn't load: ${esc(e.message)}</div>`);
  } finally { f.loading = false; }
  const m = $("#main"); if (feed === f && m.scrollHeight <= m.clientHeight + 600) requestAnimationFrame(loadMore);
}

async function loadPrev() {
  const f = feed;
  if (!f || f.loadingPrev || f.base === 0) return;
  f.loadingPrev = true;
  try {
    const start = Math.max(0, f.base - PAGE);
    const r = await fetchPage(start, f.base - start);
    if (f !== feed) return;
    // keep what's on screen where it is while new rows appear above it
    const anchor = [...document.querySelectorAll("#days .tile")].find(t => t.getBoundingClientRect().bottom > 64);
    const anchorTop = anchor?.getBoundingClientRect().top;
    f.items.unshift(...r.items); f.base = start;
    renderSections(true);
    if (anchor) { const again = document.querySelector(`#days .tile[data-id="${anchor.dataset.id}"]`);
      if (again) $("#main").scrollTop += again.getBoundingClientRect().top - anchorTop; }
  } finally { f.loadingPrev = false; }
  // the top marker only signals once while it stays in view: keep going while it's still near the screen
  const top = $("#topSentinel");
  if (feed === f && f.base > 0 && top && top.getBoundingClientRect().bottom > -1200) requestAnimationFrame(loadPrev);
}

async function jumpTo(offset) {
  const f = feed; if (!f) return;
  offset = Math.max(0, Math.min(offset, (f.total || 1) - 1));
  f.base = offset; f.items = [];
  $("#days").innerHTML = "";
  $("#main").scrollTop = $("#days").offsetTop - 70;
  await loadMore();
  $("#main").scrollTop = $("#days").offsetTop - 70;
  loadPrev();   // the top marker is already in view, so it won't signal: start filling in earlier months now
}

// How timelines look (remembered in this browser): grouped by day or one continuous grid, tile size, square or true shape
const loadingHtml = (text = "Loading…") => `<div class="loading"><span class="spin"></span>${text}</div>`;
const VIEW = {group: "day", size: "m", shape: "actual"};
try { Object.assign(VIEW, JSON.parse(localStorage.getItem("pv-view") || "{}")); } catch {}
const SIZES = {s: .6, m: 1, l: 1.5};
function rowHeight() { return Math.round((innerWidth < 600 ? 112 : innerWidth < 1200 ? 180 : 220) * (SIZES[VIEW.size] || 1)); }
function viewMenu() {
  const opt = (k, v, label) => `<button class="seg ${VIEW[k] === v ? "on" : ""}" data-k="${k}" data-v="${v}">${label}</button>`;
  return `<div class="view-menu" id="viewMenu" hidden>
    <div class="vm-row"><span>Layout</span>${opt("group", "day", "By date")}${opt("group", "none", "Continuous")}</div>
    <div class="vm-row"><span>Size</span>${opt("size", "s", "Small")}${opt("size", "m", "Medium")}${opt("size", "l", "Large")}</div>
    <div class="vm-row"><span>Shape</span>${opt("shape", "square", "Square")}${opt("shape", "actual", "Actual")}</div></div>`;
}
function bindViewMenu() {
  const btn = $("#viewBtn"), menu = $("#viewMenu"); if (!btn || !menu) return;
  btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  menu.onclick = e => {
    e.stopPropagation();
    const b = e.target.closest(".seg"); if (!b) return;
    VIEW[b.dataset.k] = b.dataset.v;
    try { localStorage.setItem("pv-view", JSON.stringify(VIEW)); } catch {}
    menu.querySelectorAll(`.seg[data-k="${b.dataset.k}"]`).forEach(x => x.classList.toggle("on", x === b));
    renderSections();
  };
  document.addEventListener("click", () => { if ($("#viewMenu")) $("#viewMenu").hidden = true; });
}

function renderSections(all = true) {
  const days = $("#days"); if (!days || !feed) return;
  const W = days.clientWidth, H = rowHeight();
  const sections = [];
  const byDay = VIEW.group !== "none";
  feed.items.forEach((it, i) => {
    const d = byDay ? it.taken_at.slice(0, 10) : "all", s = sections[sections.length - 1];
    if (!s || s.day !== d) sections.push({day: d, items: [[it, i]]}); else s.items.push([it, i]);
  });
  days.classList.toggle("continuous", !byDay);
  let html = "";
  for (const s of sections) {
    const allPicked = s.items.every(([it]) => picked.has(it.id));
    html += !byDay ? `<section class="day">` : `<section class="day"><h3><span class="day-sel ${allPicked && picked.size ? "on" : ""}" data-day="${s.day}" title="Select all from this day" role="button" aria-label="Select all from this day">${ico("check")}</span>${dayLabel(s.items[0][0].taken_at)}</h3>`;
    let row = [], sumA = 0;
    const flush = fill => {
      if (!row.length) return;
      const h = fill ? (W - GAP * (row.length - 1)) / sumA : H;
      html += `<div class="row">` + row.map(([it, i, a]) => tileHtml(it, Math.floor(a * h), Math.round(h), i)).join("") + `</div>`;
      row = []; sumA = 0;
    };
    for (const [it, i] of s.items) {
      const a = VIEW.shape === "square" ? 1 : it.width && it.height ? Math.min(3, Math.max(.4, it.width / it.height)) : 1;
      row.push([it, i, a]); sumA += a;
      if (sumA * H + GAP * (row.length - 1) >= W) flush(true);
    }
    flush(false);
    html += `</section>`;
  }
  days.innerHTML = html;
  days.classList.toggle("selecting", picked.size > 0);
  updateScrubberPos();
}

function tileHtml(it, w, h, i) {
  let inner = it.thumb !== -1
    ? `<img loading="lazy" decoding="async" src="/thumb/${it.id}" alt="" onload="this.classList.add('ok')" onerror="thumbFailed(this)">`
    : `<span class="fname">${esc(it.name)}</span>`;
  inner += `<span class="sel" title="Select">${ico("check")}</span>`;
  if (it.kind === "video") inner += `<span class="dur">${dur(it.duration)}${ico("play")}</span>`;
  if (it.fav) inner += `<span class="fav">${ico("star")}</span>`;
  if (it.live_id) inner += `<span class="live" title="Live Photo">${ico("live")}LIVE</span>`;
  if (!it.cloud) inner += `<span class="off" title="Not backed up to Telegram yet">${ico("cloud-off")}</span>`;
  return `<div class="tile ${picked.has(it.id) ? "picked" : ""}" data-i="${i}" data-id="${it.id}" style="width:${w}px;height:${h}px">${inner}</div>`;
}
function thumbFailed(img) {
  const tile = img.closest(".tile"); const it = feed?.items[+tile.dataset.i];
  if (it) it.thumb = -1;
  img.outerHTML = `<span class="fname">${esc(it ? it.name : "")}</span>`;
}

$("#page").addEventListener("click", e => {
  const ds = e.target.closest("#days .day-sel"); if (ds) return pickDay(ds);
  const t = e.target.closest("#days .tile"); if (!t) return;
  if (heldTile) { heldTile = false; return; }       // that was a long press: it already selected the photo
  if (e.target.closest(".sel") || picked.size) {
    const id = +t.dataset.id;
    e.shiftKey && lastPicked !== null ? pickRange(lastPicked, id) : togglePick(id, t);
    lastPicked = id;
    return;
  }
  openViewer(+t.dataset.i);
});
// phones: hold a photo to start selecting
let holdTimer = null, heldTile = false, lastPicked = null;
$("#page").addEventListener("touchstart", e => {
  heldTile = false; clearTimeout(holdTimer);
  const t = e.target.closest("#days .tile"); if (!t || e.touches.length > 1) return;
  holdTimer = setTimeout(() => { heldTile = true; togglePick(+t.dataset.id, t); lastPicked = +t.dataset.id; navigator.vibrate?.(10); }, 450);
}, {passive: true});
["touchmove", "touchend", "touchcancel"].forEach(n => $("#page").addEventListener(n, () => clearTimeout(holdTimer), {passive: true}));
$("#page").addEventListener("contextmenu", e => { if (heldTile) e.preventDefault(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { renderSections(true); drawScrubber(); }, 120); });
$("#main").addEventListener("scroll", () => {
  $("#topbar").classList.toggle("scrolled", $("#main").scrollTop > 0);
  updateScrubberPos();
  if (feed?.months && !$("#scrubber").hidden) scrubberShow();
}, {passive: true});
new IntersectionObserver(es => es[0].isIntersecting && loadMore(), {root: $("#main"), rootMargin: "2000px"}).observe($("#sentinel"));
const topObserver = new IntersectionObserver(es => es[0].isIntersecting && loadPrev(), {root: $("#main"), rootMargin: "1200px"});

function pickRange(a, b) {                 // shift-click: everything between the last pick and this one

  if (i < 0 || j < 0) return togglePick(b, document.querySelector(`#days .tile[data-id="${b}"]`));

function dialog(html) {

}
function promptDialog(title, label, value = "", type = "text") {

      <div class="actions"><button class="txt-btn" data-x="0">Cancel</button><button class="fill-btn" data-x="1">Save</button></div>`);
    const inp = d.querySelector("#dlgIn"); inp.focus(); inp.select();

  });
}
function confirmDialog(title, text, ok = "OK") {
  return new Promise(res => {
    const d = dialog(`<h2>${esc(title)}</h2><p>${text}</p><div class="actions"><button class="txt-btn" data-x="0">Cancel</button><button class="fill-btn" data-x="1">${esc(ok)}</button></div>`);
    d.onclick = e => { if (e.target === d) { d.remove(); res(false); } const b = e.target.closest("[data-x]"); if (b) { d.remove(); res(b.dataset.x === "1"); } };

function pickDialog(title, options, extra = "") {

    d.onclick = e => {

// ---------- date scrubber ----------
async function loadMonths() {
  const f = feed; if (!f || !f.total || f.total < 60) return;
  try { f.months = await api(feedUrl("/api/months")); } catch { return; }
  if (f !== feed) return;
  drawScrubber();
}
function hideScrubber() { $("#scrubber").hidden = true; document.body.classList.remove("with-scrubber"); }
// Space on the bar: mostly by photo count, but every month gets a share too, so years with few photos still get a
// readable slot instead of being squeezed together at one end.
function scrubberLayout(f) {
  const n = f.months.length, sc = $("#scrubber"), H = sc.clientHeight - 20;
  let cum = 0, wsum = 0;
  f.cum = f.months.map(m => { const c = cum; cum += m.n; return c; });
  const w = f.months.map(m => 0.65 * m.n / f.total + 0.35 / n);
  f.ys = w.map(x => { const y = 10 + H * wsum; wsum += x; return y; });
  f.hs = w.map(x => H * x);
}
const yForIndex = (f, idx) => {
  let i = f.cum.findIndex((c, k) => idx < c + f.months[k].n); if (i < 0) i = f.months.length - 1;
  return f.ys[i] + f.hs[i] * Math.min(1, (idx - f.cum[i]) / Math.max(1, f.months[i].n));
};
function indexForY(f, y) {
  let i = f.ys.findIndex((top, k) => y < top + f.hs[k]); if (i < 0) i = f.months.length - 1;
  const frac = Math.min(1, Math.max(0, (y - f.ys[i]) / Math.max(1, f.hs[i])));
  return {month: i, idx: Math.min(f.total - 1, f.cum[i] + Math.floor(frac * f.months[i].n))};
}
function drawScrubber() {
  const f = feed, sc = $("#scrubber");
  if (!f?.months || f.months.length < 2) return hideScrubber();
  const wasOn = document.body.classList.contains("with-scrubber");
  sc.hidden = false; document.body.classList.add("with-scrubber");
  if (!wasOn) renderSections();      // the page just got narrower for the bar: lay the rows out again so none overflow
  scrubberLayout(f);
  let lastY = -99, html = "";
  f.months.forEach((m, i) => {
    const yr = m.m.slice(0, 4), prevYr = i ? f.months[i - 1].m.slice(0, 4) : null;
    if (yr !== prevYr && f.ys[i] - lastY > 18) { html += `<span class="yr" style="top:${f.ys[i]}px">${yr}</span>`; lastY = f.ys[i]; }
  });
  sc.innerHTML = html + `<span class="pos" id="scPos"></span><span class="tip" id="scTip"></span>`;
  updateScrubberPos();
}
function scTip(y, text) {
  const tip = $("#scTip"); if (!tip) return;
  tip.textContent = text; tip.style.top = y + "px";
}
let scDrag = null, scIdle = null;
function scrubberShow() {        // the date bubble (and, on phones, the bar) shows while you scroll or drag
  const sc = $("#scrubber"); sc.classList.add("active");
  clearTimeout(scIdle); scIdle = setTimeout(() => { if (!scDrag) sc.classList.remove("active"); }, 1200);
}
function scrubAt(clientY) {
  const f = feed, r = $("#scrubber").getBoundingClientRect(), y = Math.min(r.height - 10, Math.max(10, clientY - r.top));
  const at = indexForY(f, y);
  scTip(y, monthLabel(f.months[at.month].m));
  $("#scPos").style.top = y + "px";
  return at;
}
$("#scrubber").addEventListener("pointerdown", e => {
  if (!feed?.months) return;
  e.preventDefault();
  $("#scrubber").setPointerCapture(e.pointerId);
  scDrag = scrubAt(e.clientY); $("#scrubber").classList.add("active", "dragging");
});
$("#scrubber").addEventListener("pointermove", e => {
  if (!feed?.months) return;
  if (scDrag) scDrag = scrubAt(e.clientY);
  else if (e.pointerType === "mouse") { const r = $("#scrubber").getBoundingClientRect(); scTip(e.clientY - r.top, monthLabel(feed.months[indexForY(feed, e.clientY - r.top).month].m)); }
});
const scDrop = () => {
  if (!scDrag) return;
  const at = scDrag; scDrag = null;
  $("#scrubber").classList.remove("dragging"); scrubberShow();
  jumpTo(feed.cum[at.month] + Math.max(0, at.idx - feed.cum[at.month]));
};
$("#scrubber").addEventListener("pointerup", scDrop);
$("#scrubber").addEventListener("pointercancel", () => { scDrag = null; $("#scrubber").classList.remove("dragging"); });
function updateScrubberPos() {
  const f = feed, pos = $("#scPos"); if (!f?.months || !pos || scDrag || !f.ys) return;
  const t = [...document.querySelectorAll("#days .tile")].find(t => t.getBoundingClientRect().bottom > 70);
  const idx = f.base + (t ? +t.dataset.i : 0), y = yForIndex(f, Math.min(idx, f.total - 1));
  pos.style.top = y + "px";
  const it = t && f.items[+t.dataset.i];
  if (it) scTip(y, monthLabel(it.taken_at.slice(0, 7)));
}
addEventListener("resize", () => { if (feed?.months && !$("#scrubber").hidden) drawScrubber(); });

  if (!r.groups.length) { box.innerHTML = `<div class="note">No similar groups ${r.total === 0 && st.similar_groups ? "left to review" : "found yet"}. ${st.similar_groups ? "" : mlNote(st)}</div>`; return; }
  r.groups.forEach(g => g.items.sort((a, b) => (b.id === g.best) - (a.id === g.best)));   // the best shot first
  const drop = r.groups.map(g => new Set(g.items.filter(it => it.id !== g.best).map(it => it.id)));
  const tg = (on) => on ? ico("close") : `${ico("check")}Keep`;
  const SHOW = 12, open = new Set();
  const groupHtml = (g, gi) => `<div class="sim-group" data-g="${gi}"><div class="head">
      <h3>${dayLabel(g.items[0].taken_at)} · ${timeLabel(g.items[0].taken_at)} · ${plural(g.items.length, "photo")}</h3>
      <button class="fill-btn owner-only" data-act="clean"></button><button class="txt-btn owner-only" data-act="dismiss" title="They're all worth keeping: stop showing this group">Keep all</button></div>
      <div class="sim-row">${g.items.slice(0, open.has(gi) ? g.items.length : SHOW).map((it, i) => tileHtml(it, 150, 150, i).replace('<span class="sel"',
        `${it.id === g.best ? `<span class="best">Best</span>` : ""}<button class="tg owner-only" data-tg="${it.id}" title="Keep or drop this one">${tg(drop[gi].has(it.id))}</button><span class="sel"`)).join("")}
        ${g.items.length > SHOW && !open.has(gi) ? `<button class="sim-more" data-act="more">+${nf(g.items.length - SHOW)} more</button>` : ""}</div></div>`;
  const paint = gi => {
    const el = box.querySelector(`.sim-group[data-g="${gi}"]`); if (!el) return;
    el.querySelectorAll(".tile").forEach(t => { const d = drop[gi].has(+t.dataset.id); t.classList.toggle("drop", d); t.classList.toggle("keep", !d); t.querySelector(".tg").innerHTML = tg(d); });
    const n = drop[gi].size, b = el.querySelector('[data-act="clean"]');
    b.textContent = n === r.groups[gi].items.length ? "Keep at least one" : n ? `Keep ${r.groups[gi].items.length - n}, drop ${n}` : "Keep all";
    b.disabled = n === r.groups[gi].items.length;
  };
  const left = () => box.querySelectorAll(".sim-group").length;
  box.innerHTML = `<div class="sim-summary" id="simCount">${plural(r.total, "group")} · ${nf(r.extra)} extra photos you could drop (${size(r.extra_bytes)}) · biggest groups first</div>` +
    r.groups.map(groupHtml).join("") + `<div id="simMoreBox"></div>`;
  r.groups.forEach((_, gi) => paint(gi));
  const moreBtn = () => { $("#simMoreBox").innerHTML = offset < r.total ? `<button class="txt-btn" id="simMore">Show ${(n => n === 1 ? "1 more group" : nf(n) + " more groups")(Math.min(60, r.total - offset))}</button>` : ""; };
  moreBtn();
  $("#simMoreBox").onclick = async e => {
    if (!e.target.closest("#simMore")) return;
    const more = await api(`/api/similar?limit=60&offset=${offset}`);
    const start = r.groups.length, shown = new Set(r.groups.map(g => g.key));
    more.groups = more.groups.filter(g => !shown.has(g.key));                     // never the same group twice
    for (const g of more.groups) {
      g.items.sort((a, b) => (b.id === g.best) - (a.id === g.best));
      r.groups.push(g); drop.push(new Set(g.items.filter(it => it.id !== g.best).map(it => it.id)));
    }
    offset += 60;
    $("#simMoreBox").insertAdjacentHTML("beforebegin", more.groups.map((g, k) => groupHtml(g, start + k)).join(""));
    more.groups.forEach((_, k) => paint(start + k));
    moreBtn();
  };
  $("#simAll").hidden = false;
  const done = (gi) => { box.querySelector(`.sim-group[data-g="${gi}"]`)?.remove(); r.total -= 1; offset -= 1; if (!left()) renderSimilar(); };
  box.onclick = async e => {
    const g = e.target.closest(".sim-group"); if (!g) return;
    const gi = +g.dataset.g, grp = r.groups[gi];
    const t = e.target.closest("[data-tg]");
    if (t) { const id = +t.dataset.tg; drop[gi].has(id) ? drop[gi].delete(id) : drop[gi].add(id); paint(gi); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "more") { open.add(gi); g.outerHTML = groupHtml(grp, gi); paint(gi); return; }
    if (act === "dismiss" || (act === "clean" && !drop[gi].size)) { await post("/api/similar/dismiss", {key: grp.key}); done(gi); return; }
    if (act === "clean") {
      const kept = grp.items.map(it => it.id).filter(id => !drop[gi].has(id));
      await trashItems([...drop[gi]]);
      if (kept.length > 1) await post("/api/similar/dismiss", {key: [...kept].sort((a, b) => a - b).join(",")});  // you kept these on purpose
      done(gi); return;
    }
    const tile = e.target.closest(".tile"); if (tile) openViewerOn(grp.items, +tile.dataset.i);
  };
  $("#simAll").onclick = async () => {
    const gis = [...box.querySelectorAll(".sim-group")].map(g => +g.dataset.g).filter(gi => drop[gi].size && drop[gi].size < r.groups[gi].items.length);
    const ids = gis.flatMap(gi => [...drop[gi]]);
    if (!ids.length) return;
    if (!await confirmDialog(`Trash ${plural(ids.length, "photo")}?`, `Keeps the marked photo in each of the ${plural(gis.length, "group")} on this page and moves the other ${plural(ids.length, "photo")} to Trash. You can put them back from the Trash page; Telegram keeps its copy.`, "Move to trash")) return;
    await trashItems(ids); renderSimilar();
  };
}

const localInput = iso => (iso || "").slice(0, 19);   // "2023-05-01T14:30:05" for <input type=datetime-local step=1>
const fmtWhen = iso => `${longDate(iso)}, ${timeLabel(iso)}`;
function dateDialog(ids, known, detail = null) {
  const one = ids.length === 1, first = known.map(k => k.taken_at).sort()[0] || "";
  const sug = detail?.date_suggestion, orig = detail?.date_original;
  return new Promise(res => {
    const d = dialog(`<div class="date-dlg"><h2>${one ? "Edit date & time" : `Edit date of ${plural(ids.length, "item")}`}</h2>
      ${sug ? `<div class="sugg"><span style="flex:1"><b>Suggested: ${fmtWhen(sug.suggested)}</b><br><span class="muted">${esc(sug.why)}</span></span>
        <button class="fill-btn" data-x="sugg">Use</button></div>` : ""}
      ${one ? "" : `<label><input type="radio" name="dm" value="shift" checked><span>Shift them all, keeping their order and spacing.<br><span class="muted">Pick the new date of the earliest one.</span></span></label>
        <label><input type="radio" name="dm" value="set"><span>Give them all the same date and time</span></label>`}
      <input type="datetime-local" id="dIn" step="1" value="${localInput(first)}">
      ${orig ? `<div class="muted">Edited. Original: ${fmtWhen(orig.orig_taken_at)}${orig.orig_src === "file" ? " (file date)" : ""} · <a id="dUndo" style="cursor:pointer;color:var(--accent)">Undo edit</a></div>` : ""}
      <div class="muted" style="margin-top:8px">Changes the date in the gallery only. Your files and the Telegram backup stay exactly as they are.</div>
      <div class="actions"><button class="txt-btn" data-x="0">Cancel</button><button class="fill-btn" data-x="1">Save</button></div></div>`);
    const close = v => { d.remove(); res(v); };
    const send = async body => {
      try { await post("/api/dates", {ids, ...body}); close(true); } catch (e) { toast(esc(e.message)); }
    };
    d.querySelector("#dUndo")?.addEventListener("click", async () => { await post("/api/dates/reset", {ids}); close(true); });
    d.onclick = e => {
      if (e.target === d) return close(false);
      const b = e.target.closest("[data-x]"); if (!b) return;

      const mode = one ? "set" : d.querySelector("input[name=dm]:checked").value;

    };
  });
}

async function pickFiles(files) {
  if (upRun?.sending) return toast("An upload is running");
  upRun?.urls?.forEach(u => URL.revokeObjectURL(u));
  upRun = {files, st: files.map(() => "checking"), filter: "missing", shown: 120, urls: []};
  drawUpload(true);
  await refreshStatus();
}
async function refreshStatus() {
  const r = upRun; if (!r) return;
  r.current = "Checking what's backed up…"; drawUpload();
  for (let i = 0; i < r.files.length; i += 1000) {
    const part = r.files.slice(i, i + 1000);
    try {
      const res = await post("/api/upload/status", {files: part.map(f => ({name: f.name, size: f.size}))});
      res.status.forEach((x, k) => { if (!["uploading", "failed"].includes(r.st[i + k])) r.st[i + k] = x; });
    } catch (e) { r.current = esc(e.message); }
    drawUpload();
  }
  r.current = ""; drawUpload(true);
}
function upCounts(r) { const c = {backed_up: 0, on_drive: 0, missing: 0, failed: 0}; r.st.forEach(x => c[x] = (c[x] || 0) + 1); return c; }
function drawUpload(grid = false) {
  const r = upRun; if (!r || !$("#upPanel")) return;
  const c = upCounts(r);
  $("#upPanel").hidden = false;
  $("#upB").textContent = nf(c.backed_up); $("#upD").textContent = nf(c.on_drive); $("#upM").textContent = nf(c.missing + c.failed);
  $("#upPickBtn").classList.toggle("disabled", !!r.sending);
  const todo = c.missing + c.failed;
  $("#upAct").innerHTML = r.sending ? `<button class="txt-btn" id="upStop">Stop</button>`
    : (todo ? `<button class="fill-btn" id="upGo">${ico("upload")}Upload ${todo === 1 ? "1 photo or video" : nf(todo) + " photos and videos"}</button>` : "") +
      (c.on_drive ? `<button class="txt-btn" id="upRefresh">Refresh</button>` : "") +
      (!todo && !c.on_drive && r.st.every(x => x !== "checking") ? `<span class="muted">Everything you picked is backed up. ✅</span>` : "");
  $("#upGo") && ($("#upGo").onclick = () => uploadMissing());
  $("#upStop") && ($("#upStop").onclick = () => { r.stopped = true; });
  $("#upRefresh") && ($("#upRefresh").onclick = () => refreshStatus());
  $("#upBarBox").hidden = !r.sending;
  if (r.sending) {
    const secs = (Date.now() - r.t0) / 1000, sent = r.sentBytes + r.curBytes, rate = sent / Math.max(1, secs), eta = rate ? (r.total - sent) / rate : 0;
    $("#upBar").style.width = Math.min(100, 100 * sent / Math.max(1, r.total)) + "%";
    $("#upNow").textContent = `${r.current} · ${size(rate)}/s${eta > 5 ? ` · about ${eta > 5400 ? Math.round(eta / 3600) + " h" : Math.max(1, Math.round(eta / 60)) + " min"} left` : ""}`;
  } else $("#upNow").innerHTML = r.current ? (r.current.startsWith("Checking") ? `<span class="spin inline"></span>` : "") + esc(r.current) : "";
  $("#upErr").textContent = c.failed ? `${plural(c.failed, "file")} couldn't be sent. Press Upload to try them again.` : "";
  if (grid) drawUpGrid();
}
function drawUpGrid() {
  const r = upRun; if (!r || !$("#upGrid")) return;
  const c = upCounts(r);
  const chips = [["missing", `Not backed up (${nf(c.missing + c.failed)})`], ["on_drive", `On hard disk (${nf(c.on_drive)})`], ["backed_up", `Backed up (${nf(c.backed_up)})`], ["all", `All (${nf(r.files.length)})`]];
  $("#upChips").hidden = false;
  $("#upChips").innerHTML = chips.map(([k, l]) => `<button class="chip ${r.filter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("");
  $("#upChips").onclick = e => { const ch = e.target.closest(".chip"); if (ch) { r.filter = ch.dataset.f; r.shown = 120; drawUpGrid(); } };
  const want = k => r.filter === "all" || r.st[k] === r.filter || (r.filter === "missing" && ["failed", "uploading"].includes(r.st[k]));
  const idx = r.files.map((_, k) => k).filter(want);
  r.urls.forEach(u => URL.revokeObjectURL(u)); r.urls = [];
  $("#upGrid").innerHTML = idx.slice(0, r.shown).map(k => {
    const f = r.files[k], isImg = f.type.startsWith("image/") && !/hei[cf]/i.test(f.type), st = r.st[k];
    let inner = `<span class="fname">${esc(f.name)}</span>`;
    if (isImg) { const u = URL.createObjectURL(f); r.urls.push(u); inner = `<img loading="lazy" src="${u}" alt="" onerror="this.remove()">` + inner; }
    if (f.type.startsWith("video/")) inner += `<span class="dur">${ico("play")}</span>`;
    return `<div class="up-tile ${st}" data-k="${k}">${inner}<span class="up-badge">${UP_LABEL[st] || "Checking…"}</span></div>`;
  }).join("") || `<div class="muted">Nothing here.</div>`;

}
function setUpTile(k) {
  const t = document.querySelector(`.up-tile[data-k="${k}"]`); if (!t) return;
  t.className = `up-tile ${upRun.st[k]}`; t.querySelector(".up-badge").textContent = UP_LABEL[upRun.st[k]];

function putFile(f, r) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload?${new URLSearchParams({name: f.name, size: f.size, modified: f.lastModified || 0})}`);
    x.upload.onprogress = e => { r.curBytes = e.loaded; drawUpload(); };
    x.onload = () => x.status < 300 ? ok(JSON.parse(x.responseText)) : bad(new Error((JSON.parse(x.responseText || "{}").detail) || x.statusText));
    x.onerror = () => bad(new Error("network"));
    x.send(f);
  });
}
async function uploadMissing() {
  const r = upRun; if (!r || r.sending) return;
  const todo = r.files.map((f, k) => k).filter(k => ["missing", "failed"].includes(r.st[k]));
  Object.assign(r, {sending: true, stopped: false, total: todo.reduce((a, k) => a + r.files[k].size, 0), sentBytes: 0, curBytes: 0, t0: Date.now()});
  let lock = null;
  const relock = async () => { try { lock = await navigator.wakeLock?.request("screen"); } catch {} };   // keep the screen on
  await relock(); document.addEventListener("visibilitychange", relock);
  let sent = 0;
  for (const k of todo) {
    if (r.stopped) break;
    const f = r.files[k];
    r.st[k] = "uploading"; setUpTile(k); r.current = f.name; r.curBytes = 0; drawUpload();
    for (let tries = 1; ; tries++) {
      try { await putFile(f, r); r.st[k] = "on_drive"; sent++; break; }
      catch (e) {
        if (tries >= 4 || e.message !== "network") { r.st[k] = "failed"; break; }
        r.current = `Connection lost, retrying ${f.name}…`; drawUpload();
        await new Promise(w => setTimeout(w, 3000 * tries));
      }
    }
    setUpTile(k); r.sentBytes += f.size; r.curBytes = 0; drawUpload();
  }
  r.sending = false; r.current = r.stopped ? "Stopped." : `Done: ${plural(sent, "file")} sent to the hard disk. They go to Telegram with the daily backup (3 AM); they show ✅ after that.`;
  document.removeEventListener("visibilitychange", relock);
  try { await post("/api/upload/done"); } catch {}
  try { await lock?.release(); } catch {}
  drawUpload(true);
}

// ---------- viewer ----------
let viewList = null;   // the list the viewer steps through (the feed, or a fixed list like search matches)
// ---------- share (the phone's own share sheet: AirDrop, Messages, WhatsApp, Save to Files ...) ----------
let sharePrefetch = null, shareCached = null;      // {id, file}: only the latest one (videos can be big)
async function shareFile(it) {
  if (shareCached?.id === it.id) return shareCached.file;
  const r = await fetch(`/share/${it.id}`);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Couldn't get this file");
  const blob = await r.blob();
  let name = it.name.replace(/ \(part \d+\)$/, "");
  if (it.kind !== "video" && !/\.(jpe?g|png|gif|webp)$/i.test(name)) name = name.replace(/\.[^.]+$/, "") + ".jpg";
  const file = new File([blob], name, {type: blob.type || (it.kind === "video" ? "video/mp4" : "image/jpeg"),
                                      lastModified: Date.parse(it.taken_at) || Date.now()});
  shareCached = {id: it.id, file};
  return file;
}
const canShareFiles = () => !!(navigator.share && navigator.canShare) &&
  navigator.canShare({files: [new File([""], "x.jpg", {type: "image/jpeg"})]});
async function shareCurrent() {
  const it = curList()[viewerIdx]; if (!it) return;
  if (!canShareFiles()) {                       // no share sheet in this browser: copy or download instead
    $("#shareMenu").querySelector('[data-sh="dl"]').href = `/original/${it.id}?download=1`;
    $("#shareMenu").querySelector('[data-sh="copy"]').hidden = it.kind === "video";
    $("#shareMenu").hidden = !$("#shareMenu").hidden;
    return;
  }
  const btn = $("#vShare"); btn.classList.add("busy");
  try {
    const file = await shareFile(it);
    if (!navigator.canShare({files: [file]})) { toast("This file can't be shared from this browser; use Download."); return; }
    try { await navigator.share({files: [file]}); }
    catch (e) {
      if (e.name === "AbortError") return;      // you closed the share sheet
      if (e.name !== "NotAllowedError") throw e;
      // fetching took too long for the browser to still count it as your tap: one more tap opens the sheet
      toast(`${esc(file.name)} is ready <button class="txt-btn" id="shareNow">Share now</button>`, 20000);
      $("#shareNow").onclick = () => navigator.share({files: [file]}).catch(() => {});
    }
  } catch (e) { toast(esc(e.message)); }
  finally { btn.classList.remove("busy"); }
}
$("#vShare").onclick = e => { e.stopPropagation(); shareCurrent(); };
$("#shareMenu").onclick = async e => {
  e.stopPropagation();
  const b = e.target.closest("[data-sh]"); if (!b) return;
  if (b.dataset.sh === "copy") {
    try {
      const it = curList()[viewerIdx], file = await shareFile(it);
      const png = await new Promise(async res => {         // the clipboard takes PNG everywhere
        const bmp = await createImageBitmap(file), c = document.createElement("canvas");
        c.width = bmp.width; c.height = bmp.height; c.getContext("2d").drawImage(bmp, 0, 0); c.toBlob(res, "image/png");
      });
      await navigator.clipboard.write([new ClipboardItem({"image/png": png})]);
      toast("Copied: paste it into any app");
    } catch { toast("Couldn't copy this one; use Download."); }
  }
  $("#shareMenu").hidden = true;
};
